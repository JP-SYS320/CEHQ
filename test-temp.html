<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonde 4</title>
<style>
body{background:#142230;color:#f0ede4;font-family:monospace;padding:14px;font-size:12px}
h1{font-size:14px;color:#c9a84c}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;
    background:#1b2d3e;padding:9px;border-radius:6px}
</style>
</head>
<body>
<h1>Parser CGRMP — Patapédia</h1>
<pre id="out">Demarrage...</pre>

<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
window.onerror = function(m,f,l){ log("ERREUR ligne " + l + " : " + m); };

var cible = "https://rivierematapedia.com/peche-information/statistiques.html";
var url = "https://currentrun-proxy.jptremblay18-cc2.workers.dev/?url=" + encodeURIComponent(cible);

fetch(url, { cache: "no-store" })
.then(function(r){ log("HTTP " + r.status); return r.text(); })
.then(function(h){
  log("Taille : " + h.length + "\n");

  var iPata = h.search(/rivi[eè]re\s+Patap[eé]dia/i);
  log("Ancre PÊCHEURS Patapedia a l index : " + iPata);
  if (iPata < 0) { log("ANCRE INTROUVABLE"); return; }

  // --- Hauteur : chercher en ARRIERE depuis l ancre
  var avant = h.substring(Math.max(0, iPata - 4000), iPata);
  var iH = avant.search(/HAUTEUR\s*DE\s*L\s*['\u2019]?\s*EAU/i);
  if (iH < 0) { log("HAUTEUR : ancre introuvable"); }
  else {
    var seg = avant.substring(iH);
    seg = seg.replace(/HAUTEUR\s*DE\s*L\s*['\u2019]?\s*EAU\s*:?/i, "");
    seg = seg.replace(/<[^>]*>/g, " ")
             .replace(/&nbsp;/gi, " ").replace(/&#160;/g, " ")
             .replace(/\s+/g, " ").trim();
    log("HAUTEUR brute : [" + seg.substring(0,60) + "]");
  }

  // --- Tableau Patapedia
  var fin = h.indexOf("</table>", iPata);
  var tbl = h.substring(iPata, fin < 0 ? iPata + 4000 : fin);
  var lignes = tbl.match(/<tr[^>]*>[\s\S]*?<\/tr>/gi) || [];
  log("\nLignes du tableau : " + lignes.length);

  function cells(tr){
    var c = tr.match(/<t[dh][^>]*>[\s\S]*?<\/t[dh]>/gi) || [];
    return c.map(function(x){
      return x.replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ")
              .replace(/&#160;/g," ").replace(/\s+/g," ").trim();
    });
  }
  lignes.forEach(function(tr,i){
    log("  [" + i + "] " + JSON.stringify(cells(tr)));
  });

  // --- Premiere valeur numerique apres l ancre (pecheurs du jour)
  var m = h.substring(iPata).match(/<td[^>]*>\s*(\d+)\s*<\/td>/i);
  log("\nPECHEURS auj. : " + (m ? m[1] : "introuvable"));
})
.catch(function(e){ log("ECHEC : " + e.message); });
</script>
</body>
</html>
