<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonde dashboard</title>
<style>
body{background:#142230;color:#f0ede4;font-family:monospace;padding:14px;font-size:12px}
h1{font-size:14px;color:#c9a84c}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;
    background:#1b2d3e;padding:9px;border-radius:6px}
</style>
</head>
<body>
<h1>Sonde — dashboard Restigouche</h1>
<pre id="out">Demarrage...</pre>

<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
window.onerror = function(m,f,l){ log("ERREUR ligne " + l + " : " + m); };

var UUID = "b13ff345-faa4-434d-b91e-9581ad5c7fc7";
var base = "https://www.licor.cloud";
var cands = [
  "/api/v2/dashboards/public/" + UUID,
  "/api/v2/dashboards/" + UUID,
  "/api/v1/dashboards/public/" + UUID,
  "/api/v2/dashboard/public/" + UUID
];

cands.forEach(function(path){
  fetch(base + path, { credentials: "omit", cache: "no-store" })
  .then(function(r){
    log("\n=== " + path + " → HTTP " + r.status);
    return r.text();
  })
  .then(function(t){
    var ids = t.match(/"channelUUID":"[0-9a-f-]+"/g);
    if (ids) {
      log("CANAUX TROUVES : " + ids.length);
      ids.forEach(function(x){ log("  " + x); });
    } else {
      log("pas de channelUUID — extrait :");
      log(t.substring(0,300));
    }
  })
  .catch(function(e){ log("\n=== " + path + " → ECHEC : " + e.message); });
});
</script>
</body>
</html>
