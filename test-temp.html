<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonde 3</title>
<style>
body{background:#142230;color:#f0ede4;font-family:monospace;padding:14px;font-size:12px}
h1{font-size:14px;color:#c9a84c}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;
    background:#1b2d3e;padding:9px;border-radius:6px}
</style>
</head>
<body>
<h1>Valeurs — Restigouche</h1>
<pre id="out">Demarrage...</pre>

<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
window.onerror = function(m,f,l){ log("ERREUR ligne " + l + " : " + m); };

var UUIDS = [
  "9a572aee-e741-45cc-9968-25fd98859837",
  "4912163a-49ad-4261-8a38-91ec07443d61",
  "5f96b027-404e-4e01-b776-0636e032d06e"
];

var body = {
  channels: UUIDS.map(function(u){
    return {
      channelUUID: u,
      channelType: "dataChannel",
      metricName: "com.onset.sensordata.temperature_si",
      aggregationFunction: "avg",
      aggregationInterval: { value: 1, unit: "minutes" },
      limit: 1,
      order: "desc"
    };
  }),
  time: { relative: { last: 1, unit: "days" } },
  dashboardUUID: "b13ff345-faa4-434d-b91e-9581ad5c7fc7"
};

fetch("https://www.licor.cloud/api/v2/timeseriesdata", {
  method: "POST", credentials: "omit",
  headers: {"Content-Type":"application/json"},
  body: JSON.stringify(body)
})
.then(function(r){ log("HTTP " + r.status); return r.json(); })
.then(function(j){
  var recs = j && j.value && j.value.records;
  if (!recs) { log("pas de records"); log(JSON.stringify(j).substring(0,800)); return; }
  log("Records : " + recs.length + "\n");
  recs.forEach(function(r){
    var pt = r.datum && r.datum.valid && r.datum.valid[0];
    log("LABEL   : " + r.sensorLabel);
    log("VALEUR  : " + (pt ? pt[1] : "aucune"));
    log("HEURE   : " + (pt ? new Date(pt[0]).toLocaleString("fr-CA") : "-"));
    log("UNITE   : " + r.metricUnits + "   canal " + r.channelUUID.substring(0,8));
    log("");
  });
})
.catch(function(e){ log("ECHEC : " + e.message); });
</script>
</body>
</html>
