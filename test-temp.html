<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonde 5</title>
<style>
body{background:#142230;color:#f0ede4;font-family:monospace;padding:14px;font-size:12px}
h1{font-size:14px;color:#c9a84c}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;
    background:#1b2d3e;padding:9px;border-radius:6px}
</style>
</head>
<body>
<h1>Parser CGRMP — Patapédia v2</h1>
<pre id="out">Demarrage...</pre>

<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
window.onerror = function(m,f,l){ log("ERREUR ligne " + l + " : " + m); };

var cible = "https://rivierematapedia.com/peche-information/statistiques.html";
var url = "https://currentrun-proxy.jptremblay18-cc2.workers.dev/?url=" + encodeURIComponent(cible);

function nett(x){
  return x.replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ")
          .replace(/&#160;/g," ").replace(/\s+/g," ").trim();
}

fetch(url, { cache: "no-store" })
.then(function(r){ log("HTTP " + r.status); return r.text(); })
.then(function(h){
  log("Taille : " + h.length);

  // Toutes les tables de la page
  var tables = h.match(/<table[\s\S]*?<\/table>/gi) || [];
  log("Tables sur la page : " + tables.length + "\n");

  var tblPata = null, idxPata = -1;
  tables.forEach(function(t, i){
    var txt = nett(t);
    var estPata = /P[EÊ]CHEURS\s+rivi[eè]re\s+Patap[eé]dia/i.test(txt);
    log("[table " + i + "] " + (estPata ? ">>> PATAPEDIA <<<" : "") );
    log("   " + txt.substring(0,110) + "...");
    if (estPata && !tblPata) { tblPata = t; idxPata = h.indexOf(t); }
  });

  if (!tblPata) { log("\nTABLE PATAPEDIA INTROUVABLE"); return; }

  log("\n=== TABLE PATAPEDIA ===");
  var lignes = tblPata.match(/<tr[^>]*>[\s\S]*?<\/tr>/gi) || [];
  lignes.forEach(function(tr,i){
    var c = (tr.match(/<t[dh][^>]*>[\s\S]*?<\/t[dh]>/gi) || []).map(nett);
    log("  [" + i + "] " + JSON.stringify(c));
  });

  // Hauteur : en arriere depuis le debut de CETTE table
  log("\n=== HAUTEUR ===");
  var avant = h.substring(Math.max(0, idxPata - 3000), idxPata);
  var iH = avant.search(/HAUTEUR[\s\S]{0,40}?EAU/i);
  if (iH < 0) { log("ancre introuvable"); log("contexte : " + nett(avant.slice(-400))); }
  else {
    var seg = nett(avant.substring(iH));
    log("brut : [" + seg.substring(0,80) + "]");
  }
})
.catch(function(e){ log("ECHEC : " + e.message); });
</script>
</body>
</html>
