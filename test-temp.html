<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test temp</title>
<style>
body{background:#142230;color:#f0ede4;font-family:monospace;padding:16px;font-size:13px}
h1{font-size:15px;color:#c9a84c}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;
    background:#1b2d3e;padding:10px;border-radius:6px}
</style>
</head>
<body>
<h1>Test API licor.cloud</h1>
<pre id="out">Demarrage...</pre>

<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }

window.onerror = function(m,f,l){ log("ERREUR JS ligne " + l + " : " + m); };

log("Script demarre OK");

var ch = function(u){
  return {
    channelUUID: u,
    channelType: "dataChannel",
    metricName: "com.onset.sensordata.temperature_si",
    aggregationFunction: "avg",
    aggregationInterval: {value:1, unit:"minutes"},
    limit: 1,
    order: "desc"
  };
};

var body = {
  channels: [
    ch("5f91e09d-4093-431a-9495-e77ccc4b6773"),
    ch("a9694522-61aa-43b3-9d9d-965c5544e579")
  ],
  time: {relative:{last:1, unit:"days"}},
  dashboardUUID: "fe3a5fc5-c5e2-4e72-8420-238421f69b85"
};

log("Body construit OK");
log("Envoi de la requete...");

fetch("https://www.licor.cloud/api/v2/timeseriesdata", {
  method: "POST",
  credentials: "omit",
  headers: {"Content-Type":"application/json"},
  body: JSON.stringify(body)
})
.then(function(r){
  log("REPONSE HTTP " + r.status);
  return r.text();
})
.then(function(t){
  log("--- CONTENU ---");
  log(t.substring(0,4000));
})
.catch(function(e){
  log("ECHEC : " + e.message);
});
</script>
</body>
</html>
