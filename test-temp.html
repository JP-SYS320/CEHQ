<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Open-Meteo</title>
<style>
body{background:#142230;color:#f0ede4;font-family:monospace;padding:14px;font-size:12px}
h1{font-size:14px;color:#c9a84c}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;
    background:#1b2d3e;padding:9px;border-radius:6px}
</style>
</head>
<body>
<h1>Test Open-Meteo — Bonaventure</h1>
<pre id="out">Demarrage...</pre>

<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
window.onerror = function(m,f,l){ log("ERREUR ligne " + l + " : " + m); };

var base = "https://api.open-meteo.com/v1/forecast?latitude=48.6280&longitude=-65.5240"
         + "&past_days=1&forecast_days=1&timezone=America%2FToronto";
var urlGem  = base + "&hourly=precipitation&models=gem_seamless";
var urlProb = base + "&daily=sunrise,sunset,precipitation_probability_max";

function essai(nom, url){
  log("\n=== " + nom + " ===");
  var ctrl = new AbortController();
  var tmout = setTimeout(function(){ ctrl.abort(); }, 8000);
  var t0 = Date.now();
  fetch(url, { cache: "no-store", signal: ctrl.signal })
  .then(function(r){
    clearTimeout(tmout);
    log("HTTP " + r.status + "  (" + (Date.now()-t0) + " ms)");
    return r.text();
  })
  .then(function(t){
    log(t.substring(0,600));
  })
  .catch(function(e){
    clearTimeout(tmout);
    log("ECHEC apres " + (Date.now()-t0) + " ms : " + e.name + " - " + e.message);
  });
}

essai("GEM (pluie)", urlGem);
essai("PROB (lever/coucher/prob)", urlProb);
</script>
</body>
</html>
